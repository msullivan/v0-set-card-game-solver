[project]
name = "set-classifier"
version = "0.1.0"
description = "Local CNN classifier for Set card attributes"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false
default-groups = []
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
        { extra = "rocm" },
    ],
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
# ROCm6 support relies on `pytorch-triton-rocm`, which should also be installed from the PyTorch index
# (and included in `project.dependencies`).
pytorch-triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[project.optional-dependencies]
# Torch build — pick exactly one (enforced by [tool.uv].conflicts above).
cpu = [
    "torch==2.11.0",
    "torchvision==0.26.0",
]
gpu = [
    "torch==2.11.0",
    "torchvision==0.26.0",
]
rocm = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "triton-rocm==3.6.0; sys_platform == 'linux'",
]
# Serving only — PIL-based preprocessing, no albumentations/opencv/scipy.
inference = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# ONNX export for browser deployment. `onnxscript` backs the torch 2.9+
# dynamo-based exporter; `onnxruntime` is used for the post-export parity check.
export = [
    "onnx>=1.17",
    "onnxscript>=0.1",
    "onnxruntime>=1.18",
]
# Training only — pulls in albumentations (and transitively opencv/scipy) + wandb.
train = [
    "albumentations>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "wandb>=0.17",
]
